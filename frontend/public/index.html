<!-- Tells the browser this is an HTML5 document -->
<!DOCTYPE html>
<!-- Root element; lang="en" tells browsers/screen readers the page is in English -->
<html lang="en">
<!-- Contains metadata about the page (not visible content) -->
<head>
  <!-- Sets character encoding so special characters/emoji render correctly -->
  <meta charset="utf-8" />
  <!-- Makes the page responsive on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Text shown in the browser tab -->
  <title>Library Management System</title>
  <!-- Icon shown in the browser tab -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
</head>
<!-- Empty container where React injects your entire app -->
<body>
<!-- Contains everything visible on the page -->
<div id="root"></div>
</body>
</html>
